repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.2.5
    hooks:
      - id: sqlfluff-lint
        args: [--dialect, clickhouse, --config, dbt/.sqlfluff]
        files: ^dbt/(models|tests)/.*\.sql$
        additional_dependencies: ["dbt-core==1.9.11", "dbt-clickhouse==1.10.3", "sqlfluff-templater-dbt==3.2.5"]
      - id: sqlfluff-fix
        args: [--dialect, clickhouse, --config, dbt/.sqlfluff]
        files: ^dbt/(models|tests)/.*\.sql$
        stages: [manual]
        additional_dependencies: ["dbt-core==1.9.11", "dbt-clickhouse==1.10.3", "sqlfluff-templater-dbt==3.2.5"]
